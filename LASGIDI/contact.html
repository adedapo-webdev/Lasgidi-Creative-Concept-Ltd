
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | LASGIDI CREATIVE CONCEPT LTD</title>

    <style>
        /* =========================
           GLOBAL STYLES
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            max-width: 100%;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000;
            color: #d9d9d9;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            padding: 25px 7%;
            width: 100%;

            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .logo {
            flex-shrink: 0;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 22px;
        }

        .nav-links a {
            color: #d9d9d9;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            padding: 5px 0;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            text-decoration: underline;
            color: #f4b942;
        }

        /* =========================
           CONTACT HERO
        ========================= */

        .contact-hero {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            position: relative;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.60),
                    rgba(0, 0, 0, 0.78)
                ),
                url("images/hero (5).jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================
           CONTACT CONTENT
        ========================= */

        .contact-content {
            position: relative;
            z-index: 2;

            width: 90%;
            max-width: 750px;

            padding-top: 180px;
            padding-bottom: 80px;

            margin-left: 8%;
            text-align: left;
        }

        .contact-content h1 {
            color: #d9d9d9;
            font-size: 42px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 1px;
            margin-bottom: 18px;

            overflow-wrap: break-word;

            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.9);
        }

        .contact-intro {
            color: #d9d9d9;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 30px;

            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* =========================
           CONTACT DETAILS
        ========================= */

        .contact-details {
            margin-bottom: 40px;
        }

        .contact-details p {
            color: #d9d9d9;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 20px;

            overflow-wrap: anywhere;

            text-shadow: 2px 2px 7px rgba(0, 0, 0, 0.9);
        }

        .contact-details strong {
            font-weight: 700;
            font-size: 18px;
            color: #f4b942;
        }

        .contact-details a {
            color: #d9d9d9;
            text-decoration: none;
            overflow-wrap: anywhere;
            transition: color 0.3s ease;
        }

        .contact-details a:hover {
            color: #f4b942;
            text-decoration: underline;
        }

        /* =========================
           CONTACT FORM HEADING
        ========================= */

        .contact-content h2 {
            color: #d9d9d9;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 1px;
            margin-bottom: 25px;

            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
        }

        /* =========================
           CONTACT FORM
        ========================= */

        .contact-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea,
        .contact-form select {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;

            padding: 16px 18px;

            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 3px;

            background: rgba(0, 0, 0, 0.72);
            color: #fff;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.85);
        }

        .contact-form select {
            cursor: pointer;
            color: #fff;
        }

        .contact-form select option {
            background: #111;
            color: #fff;
        }

        .contact-form input:focus,
        .contact-form textarea:focus,
        .contact-form select:focus {
            outline: 1px solid #f4b942;
            border-color: #f4b942;
        }

        .contact-form textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.6;
        }

        /* =========================
           SEND MESSAGE BUTTON
        ========================= */

        .contact-form button {
            align-self: flex-start;
            max-width: 100%;

            padding: 15px 28px;
            margin-top: 5px;

            border: 2px solid #f4b942;
            border-radius: 2px;

            background: transparent;
            color: #fff;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;

            cursor: pointer;
            transition: all 0.3s ease;
        }

        .contact-form button:hover {
            background: #f4b942;
            color: #000;
        }

        /* =========================
           TABLETS
        ========================= */

        @media screen and (max-width: 900px) {
            nav {
                padding: 22px 5%;
                gap: 16px;
            }

            .logo {
                font-size: 19px;
            }

            .nav-links {
                gap: 10px 16px;
            }

            .nav-links a {
                font-size: 14px;
            }

            .contact-content {
                width: 90%;
                max-width: 700px;
                margin-left: 5%;
                padding-top: 150px;
                padding-bottom: 60px;
            }

            .contact-content h1 {
                font-size: 38px;
            }

            .contact-intro {
                font-size: 17px;
            }
        }

        /* =========================
           MOBILE PHONES
        ========================= */

        @media screen and (max-width: 600px) {
            nav {
                position: absolute;

                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;

                gap: 14px;
                padding: 18px 5%;
            }

            .logo {
                font-size: 19px;
                letter-spacing: 1.5px;
            }

            .nav-links {
                width: 100%;
                justify-content: flex-start;
                gap: 8px 18px;
            }

            .nav-links a {
                font-size: 13px;
                padding: 4px 0;
            }

            .contact-hero {
                min-height: 100vh;
                min-height: 100svh;

                background-position: center;
                background-size: cover;
            }

            .contact-content {
                width: 90%;
                max-width: 100%;

                margin-left: 5%;
                padding-top: 155px;
                padding-bottom: 45px;
            }

            .contact-content h1 {
                font-size: clamp(27px, 7.5vw, 36px);
                line-height: 1.2;
                letter-spacing: 0.4px;
                margin-bottom: 15px;
            }

            .contact-intro {
                font-size: 15px;
                line-height: 1.7;
                margin-bottom: 25px;
            }

            .contact-details {
                margin-bottom: 30px;
            }

            .contact-details p {
                font-size: 15px;
                line-height: 1.8;
                margin-bottom: 18px;
            }

            .contact-details strong {
                font-size: 16px;
            }

            .contact-content h2 {
                font-size: 23px;
                line-height: 1.3;
                margin-bottom: 20px;
            }

            .contact-form {
                gap: 13px;
            }

            .contact-form input,
            .contact-form textarea,
            .contact-form select {
                padding: 14px 13px;
                font-size: 15px;
            }

            .contact-form textarea {
                min-height: 120px;
            }

            .contact-form button {
                width: 100%;
                padding: 14px 16px;
                font-size: 14px;
                text-align: center;
            }
        }

        /* =========================
           EXTRA-SMALL PHONES
        ========================= */

        @media screen and (max-width: 360px) {
            nav {
                padding: 16px 4%;
                gap: 12px;
            }

            .logo {
                font-size: 17px;
            }

            .nav-links {
                gap: 8px 13px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .contact-content {
                width: 92%;
                margin-left: 4%;
                padding-top: 145px;
                padding-bottom: 35px;
            }

            .contact-content h1 {
                font-size: 27px;
            }

            .contact-intro {
                font-size: 14px;
            }

            .contact-details p {
                font-size: 14px;
            }

            .contact-details strong {
                font-size: 15px;
            }

            .contact-content h2 {
                font-size: 21px;
            }

            .contact-form input,
            .contact-form textarea,
            .contact-form select {
                padding: 13px 11px;
                font-size: 14px;
            }

            .contact-form button {
                font-size: 13px;
                padding: 13px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->

    <nav>
        <div class="logo">LASGIDI</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- CONTACT SECTION -->

    <main>
        <section class="contact-hero">

            <div class="contact-content">

                <h1>GET IN TOUCH WITH US</h1>

                <p class="contact-intro">
                    Let's create something unforgettable for your event.
                </p>

                <!-- CONTACT DETAILS -->

                <div class="contact-details">

                    <p>
                        <strong>WhatsApp:</strong><br>

                        <a
                            href="https://wa.me/2348161250868"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            +234 816 125 0868
                        </a>
                        <br>

                        <a
                            href="https://wa.me/2348159550306"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            +234 815 955 0306
                        </a>
                    </p>

                    <p>
                        <strong>Email:</strong><br>

                        <a href="mailto:lasgidicrea8ive@gmail.com">
                            lasgidicrea8ive@gmail.com
                        </a>
                    </p>

                    <p>
                        <strong>Instagram:</strong><br>

                        <a
                            href="https://www.instagram.com/lasgidiscreenguy/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            @lasgidiscreenguy
                        </a>
                    </p>

                </div>

                <!-- CONTACT FORM -->

                <h2>SEND A MESSAGE</h2>

                <form
                    class="contact-form"
                    onsubmit="sendMessage(event)"
                >

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your Name"
                        autocomplete="name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Your Email"
                        autocomplete="email"
                        required
                    >

                    <input
                        type="tel"
                        id="tel"
                        name="tel"
                        placeholder="Your Phone Number"
                        autocomplete="tel"
                        required
                    >

                    <textarea
                        id="MESSAGE"
                        name="message"
                        placeholder="Tell us about your event..."
                        rows="5"
                        required
                    ></textarea>

                    <select id="sendTo" name="sendTo" required>
                        <option value="">SEND MESSAGE VIA</option>
                        <option value="email">Email</option>
                        <option value="whatsapp">WhatsApp</option>
                    </select>

                    <button type="submit">
                        SEND MESSAGE
                    </button>

                </form>

            </div>

        </section>
    </main>

    <script>
        function sendMessage(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("tel").value.trim();
            const message = document.getElementById("MESSAGE").value.trim();
            const sendTo = document.getElementById("sendTo").value;

            const subject = "Event Enquiry from " + name;

            const body =
                "Name: " + name + "\n" +
                "Email: " + email + "\n" +
                "Phone: " + phone + "\n\n" +
                "Event Details:\n" + message;

            if (sendTo === "email") {
                const mailto =
                    "mailto:lasgidicrea8ive@gmail.com" +
                    "?subject=" + encodeURIComponent(subject) +
                    "&body=" + encodeURIComponent(body);

                window.location.href = mailto;

            } else if (sendTo === "whatsapp") {
                const whatsappMessage =
                    "Hello LASGIDI CREATIVE CONCEPT LTD,\n\n" +
                    body;

                const whatsappURL =
                    "https://wa.me/2348161250868?text=" +
                    encodeURIComponent(whatsappMessage);

                window.open(
                    whatsappURL,
                    "_blank",
                    "noopener,noreferrer"
                );
            }
        }
    </script>

</body>
</html>
